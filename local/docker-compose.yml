# Lokalny stack RAG (odpowiednik architektury z Google Cloud).
#
# Uruchamia:
#   - qdrant        : baza wektorowa (zamiast BigQuery Vector Search)
#   - orchestration : FastAPI (te same endpointy co w chmurze)
#
# Modele (Bielik LLM + EmbeddingGemma) serwuje natywna Ollama na hoście
# (localhost:11434). Kontener orchestration łączy się z nią przez
# host.docker.internal (patrz extra_hosts poniżej).
#
# Start:   docker compose up --build
# UI:      http://localhost:8080

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  orchestration:
    build:
      context: ..
      dockerfile: local/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434"
      QDRANT_URL: "http://qdrant:6333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
